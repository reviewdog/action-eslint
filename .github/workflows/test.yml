name: test
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Test eslint-formatter-rdjson
        run: ./eslint-formatter-rdjson/test.sh
      - name: Test eslint_flags parsing
        run: ./script_test.sh
      - name: Test changed-file selection
        run: bash ./script_changed_test.sh
      - name: Test entrypoint exit status
        run: bash ./script_exit_test.sh
